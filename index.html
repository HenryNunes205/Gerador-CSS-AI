<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeradorCSS AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <h1>CSS Gerador <span class="destaque">com IA✌️</span></h1>

        <p class="subtitulo">Descreva o que você imagina e veja a mágica acontecer</p>
        <textarea rows="3" maxlength="500" class="caixa-texto" placeholder="Digite aqui" aria-label="Descrição do componente que você quer gerar"></textarea>

        <div class="acoes">
            <button class="botao-gerar">Gerar Código ✌️</button>
            <button class="botao-refinar" disabled>Refinar ✨</button>
            <button class="botao-limpar">Limpar</button>
        </div>

        <div class="mensagem" role="alert" hidden></div>

        <div class="resultado">
            <section class="painel">
                <div class="cabecalho-bloco">
                    <h2>Código</h2>
                    <button class="botao-copiar" disabled>Copiar</button>
                </div>
                <pre class="bloco-codigo"></pre>
            </section>
            <section class="painel">
                <div class="cabecalho-bloco">
                    <h2>Preview</h2>
                </div>
                <iframe class="resultado-codigo" sandbox="" title="Preview do código gerado"></iframe>
            </section>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
